# Helm chart CI for the silencer chart at helm/silencer/.
#
# Delegates to the reusable helm-chart workflow at vtmocanu/forgejo-workflows.
# Local concerns kept here:
#   - Triggers and paths filter (helm/** and this workflow file)
#   - Concurrency policy (queue, don't cancel — partial OCI manifests are bad)
#   - Chart dir + OCI namespace
#   - Secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN from Codeberg repo settings)

name: chart

on:
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - '.forgejo/workflows/chart.yml'
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.forgejo/workflows/chart.yml'
  # Manual trigger: useful for re-running after a transient registry failure
  # without bumping Chart.yaml. The reusable workflow's detection step uses
  # registry presence (not git diff) so it Just Works without extra inputs.
  workflow_dispatch: {}

concurrency:
  group: chart-${{ github.ref }}
  # Chart pushes are idempotent (same version = same content), but cancelling
  # mid-push could leave a partial OCI manifest. Queue instead.
  cancel-in-progress: false

permissions:
  contents: write   # required for helm-docs auto-commit (inherited by reusable workflow)

jobs:
  chart-caller:
    uses: vtmocanu/forgejo-workflows/.forgejo/workflows/helm-chart.yml@v1.1.0
    with:
      chart-dir: helm/silencer
      oci-namespace: vtmocanu
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
