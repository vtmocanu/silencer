# Build & release workflow for silencer.
#
# Delegates to the reusable container-build workflow at
# vtmocanu/forgejo-workflows. Local concerns kept here:
#   - Triggers and paths-ignore (silencer-specific files)
#   - Concurrency policy
#   - Image name + push policy (only on v* tags)
#   - Secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN from Codeberg repo settings)
#
# Versioning is manual via `git tag vX.Y.Z`. No `:latest` tag — every push
# to Docker Hub is exactly the git tag.

name: build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'helm/**'
      - 'docs/**'
      - 'logo.png'
      - '.releaserc.json'
      - '.grype.yaml'
      - '.trivyignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'helm/**'
      - 'docs/**'
      - 'logo.png'
      - '.releaserc.json'
      - '.grype.yaml'
      - '.trivyignore'
    tags:
      - 'v*'

concurrency:
  # Group by ref so the same branch/tag doesn't build twice in parallel.
  group: build-${{ github.ref }}
  # Cancel superseded PR/main builds, but never cancel a tag build.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    uses: vtmocanu/forgejo-workflows/.forgejo/workflows/container-build.yml@v1.0.0
    with:
      image: docker.io/vtmocanu/silencer
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
