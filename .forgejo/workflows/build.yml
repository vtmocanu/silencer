# Build & release workflow for silencer.
#
# Triggers:
#   - pull_request to main         → build only (smoke test, no push)
#   - push to main                 → build only (smoke test, no push)
#   - push to tag matching v*      → build + push to Docker Hub with the tag name
#
# Notes:
#   - Runs on Codeberg's hosted Forgejo Actions runners (rootless Podman in LXC).
#     Neither docker nor podman is available; we use buildah with vfs storage
#     and chroot isolation per Codeberg's documented constraints.
#   - amd64 only for now; multi-arch (linux/arm64) is doable later via
#     `buildah manifest` + QEMU but is significantly slower on hosted runners.
#   - Versioning is manual via `git tag vX.Y.Z` (no semantic-release yet).
#   - No `:latest` tag — every push to Docker Hub is exactly the git tag.
#
# Required Codeberg secrets (Settings → Actions → Secrets):
#   - DOCKERHUB_USERNAME — Docker Hub username (could be a variable instead)
#   - DOCKERHUB_TOKEN    — Docker Hub access token with Read & Write scope
#                          (Docker Hub → Account Settings → Personal access tokens)

name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  # Group by ref so the same branch/tag doesn't build twice in parallel.
  group: build-${{ github.ref }}
  # Cancel superseded PR/main builds, but never cancel a tag build.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: docker.io/vtmocanu/silencer
  # Buildah flags required on Codeberg's rootless-podman-in-LXC runners.
  STORAGE_DRIVER: vfs
  BUILDAH_ISOLATION: chroot

jobs:
  build:
    name: Build and Push
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          # On a v* tag, use the tag verbatim; otherwise use a short-SHA dev tag
          # (we won't push the dev tag — it's just for the local build to succeed).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="ci-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${TAG}"

      - name: Build image (linux/amd64)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          buildah --storage-driver="$STORAGE_DRIVER" bud \
            --isolation="$BUILDAH_ISOLATION" \
            --platform linux/amd64 \
            --tag "${IMAGE}:${TAG}" \
            .

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          buildah --storage-driver="$STORAGE_DRIVER" login docker.io \
            -u "$DOCKERHUB_USERNAME" \
            --password-stdin <<< "$DOCKERHUB_TOKEN"

      - name: Push image to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          buildah --storage-driver="$STORAGE_DRIVER" push "${IMAGE}:${TAG}"
          echo "Pushed: ${IMAGE}:${TAG}"
