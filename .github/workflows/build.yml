# Build & release workflow for silencer.
#
# Triggers:
#   - pull_request to main         → build only (smoke test, no push)
#   - push to main                 → build only (smoke test, no push)
#   - push to tag matching v*      → build + push to GHCR with the tag name
#
# Auth: ${{ secrets.GITHUB_TOKEN }} with `packages: write` permission.
# No manual PAT or DOCKERHUB_* secrets needed.
#
# Versioning is manual via `git tag vX.Y.Z`. No `:latest` tag — every push
# to GHCR is exactly the git tag.
#
# amd64 only for now; multi-arch (linux/arm64) is doable via QEMU but
# significantly slower on hosted runners. Defer until there's user demand.
#
# Action versions are SHA-pinned per OSS supply-chain best practice
# (post-tj-actions/changed-files 2025 incident). The `# vX.Y.Z` comment
# next to each SHA tracks the human-readable version. Renovate will keep
# both in sync via a custom regex manager once it's wired up here.

name: build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'helm/**'
      - 'docs/**'
      - 'logo.png'
      - '.releaserc.json'
      - '.grype.yaml'
      - '.trivyignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'helm/**'
      - 'docs/**'
      - 'logo.png'
      - '.releaserc.json'
      - '.grype.yaml'
      - '.trivyignore'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write   # for GHCR push on v* tags

env:
  IMAGE: ghcr.io/vtmocanu/silencer
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # We don't push back to git in this workflow; don't persist
          # the GITHUB_TOKEN in the repo's git config.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve image tag
        id: tag
        run: |
          # On a v* tag, use the tag verbatim; otherwise use a short-SHA dev tag
          # (we won't push the dev tag — it's just for the local build to succeed).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="ci-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${TAG}"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          # GitHub Actions cache — reuses BuildKit layers across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Suppress the SLSA provenance attestation. GHCR shows it as a
          # separate "unknown" tag in the package UI which is just noise.
          # Revisit if/when we add cosign/SLSA properly.
          provenance: false
