# `secrets.mode=externalSecret` — chart renders an ExternalSecret CR.
secrets:
  mode: externalSecret
  externalSecret:
    secretStoreRef:
      name: my-cluster-store
      kind: ClusterSecretStore
    appToken:
      remoteRef:
        key: /silencer/SLACK_APP_TOKEN
    botToken:
      remoteRef:
        key: /silencer/SLACK_BOT_TOKEN
