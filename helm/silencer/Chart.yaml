apiVersion: v2
# Chart name is `silencer` (matches app + dir name). Published to GHCR at
# oci://ghcr.io/vtmocanu/charts/silencer — the `charts/` sub-namespace is
# the helm/chart-releaser-action convention and avoids collision with the
# container image package at ghcr.io/vtmocanu/silencer (GHCR scopes
# packages by name, so a flat `vtmocanu/silencer` would mix image + chart
# tags into the same package).
name: silencer
description: Slack bot that silences Prometheus Alertmanager alerts via thread replies.
type: application

# Chart's own SemVer. Bump independently of appVersion.
# 0.3.0: breaking — chart name renamed silencer-chart → silencer (drops
#        the Docker Hub flat-namespace workaround now that we publish to
#        GHCR). Default image.repository moved docker.io → ghcr.io.
#        OCI URL: oci://ghcr.io/vtmocanu/charts/silencer.
# 0.2.1: bumps appVersion to v2.0.3 (bot no longer crashes when replying
#        `s 1h` to an alert whose Slack template lacks a Silence button).
# 0.2.0: breaking — secrets.existing.appTokenKey/botTokenKey moved to
#        secrets.appTokenKey/botTokenKey (used in all modes). Liveness
#        probe path now defaults to /livez (always-200 endpoint added
#        in app v2.0.2).
version: 0.3.0

# Upstream application version. Tracks ghcr.io/vtmocanu/silencer tags
# verbatim (the published tags include the leading `v`, e.g. v2.0.3).
appVersion: "v2.0.3"

kubeVersion: ">=1.29.0-0"

home: https://github.com/vtmocanu/silencer
sources:
  - https://github.com/vtmocanu/silencer

icon: https://raw.githubusercontent.com/vtmocanu/silencer/main/logo.png

keywords:
  - alertmanager
  - prometheus
  - slack
  - chatops
  - silencing
  - monitoring
  - observability

maintainers:
  - name: Vlad Mocanu
    url: https://github.com/vtmocanu

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/vtmocanu/silencer
    - name: Container image
      url: https://github.com/vtmocanu/silencer/pkgs/container/silencer
  artifacthub.io/category: monitoring
