{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
{{- /*
  When ServiceMonitor is enabled, auto-inject an ingress rule from the
  monitoring namespace so Prometheus can still scrape /metrics. Without this,
  enabling networkPolicy alongside serviceMonitor silently breaks scraping.
*/ -}}
{{- $autoScrape := and .Values.serviceMonitor.enabled (ne $np.scrapeNamespace "") -}}
{{- $hasManualIngress := or $np.ingress.fromNamespaceSelectors $np.ingress.fromPodSelectors -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "silencer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "silencer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "silencer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if or $autoScrape $hasManualIngress }}
    - from:
        {{- if $autoScrape }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.scrapeNamespace }}
        {{- end }}
        {{- range $np.ingress.fromNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range $np.ingress.fromPodSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    []
    {{- end }}
  egress:
    {{- with $np.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - {}
    {{- end }}
{{- end }}
