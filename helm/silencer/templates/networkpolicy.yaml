{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "silencer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "silencer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "silencer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- $ingress := .Values.networkPolicy.ingress -}}
    {{- if or $ingress.fromNamespaceSelectors $ingress.fromPodSelectors }}
    - from:
        {{- range $ingress.fromNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range $ingress.fromPodSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    []
    {{- end }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - {}
    {{- end }}
{{- end }}
