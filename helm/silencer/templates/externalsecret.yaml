{{- if eq .Values.secrets.mode "externalSecret" -}}
{{- $es := .Values.secrets.externalSecret -}}
{{- $storeName := required "secrets.externalSecret.secretStoreRef.name is required when secrets.mode=externalSecret" $es.secretStoreRef.name -}}
{{- $appKey := required "secrets.externalSecret.appToken.remoteRef.key is required when secrets.mode=externalSecret" $es.appToken.remoteRef.key -}}
{{- $botKey := required "secrets.externalSecret.botToken.remoteRef.key is required when secrets.mode=externalSecret" $es.botToken.remoteRef.key -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "silencer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "silencer.labels" . | nindent 4 }}
  {{- with $es.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "silencer.fullname" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "silencer.labels" . | nindent 12 }}
  data:
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: {{ $appKey | quote }}
        {{- with $es.appToken.remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: {{ $botKey | quote }}
        {{- with $es.botToken.remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
