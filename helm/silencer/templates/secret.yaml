{{- if eq .Values.secrets.mode "create" -}}
{{- $appToken := required "secrets.create.appToken is required when secrets.mode=create" .Values.secrets.create.appToken -}}
{{- $botToken := required "secrets.create.botToken is required when secrets.mode=create" .Values.secrets.create.botToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "silencer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "silencer.labels" . | nindent 4 }}
  {{- with .Values.secrets.create.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ include "silencer.appTokenKey" . }}: {{ $appToken | quote }}
  {{ include "silencer.botTokenKey" . }}: {{ $botToken | quote }}
{{- end }}
